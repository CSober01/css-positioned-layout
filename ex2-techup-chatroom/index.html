<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="./style.css" />
  <script src="https://kit.fontawesome.com/bf7220ad33.js" crossorigin="anonymous"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun&display=swap" rel="stylesheet">
  <title>Positioned Layout Exercise 2 TechUp Chatroom</title>
</head>

<body>
  <header>
    <h1>Techup Chatroom</h1>
  </header>

  <main>
    <section class="outgoing" aria-label="ข้อความที่ส่ง">
      <article class="bubble bubble-green">
        <p>สวัสดีจ้า</p>
        <span class="badge badge-green">1</span>
      </article>
      <article class="bubble bubble-light">
        <p>Coding สนุกจังเลย</p>
        <span class="badge badge-gray">2</span>
      </article>
      <article class="bubble bubble-green">
        <p>🥳 😊</p>
      </article>
    </section>

    <section class="incoming" aria-label="ข้อความที่ได้รับ">
      <article class="bubble bubble-gray">
        <p>🥳</p>
      </article>
      <article class="bubble bubble-gray">
        <p>🎉</p>
      </article>
    </section>
  </main>
</body>

</html>
