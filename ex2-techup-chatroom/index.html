<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="./style.css" />
  <script src="https://kit.fontawesome.com/bf7220ad33.js" crossorigin="anonymous"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun&display=swap" rel="stylesheet">
  <title>Positioned Layout Exercise 2 TechUp Chatroom</title>
</head>

<body>
  <div class="header">Techup Chatroom</div>

  <div class="chat-container">
    <div class="message-row right">
      <div class="bubble green-bubble tail">สวัสดีจ้า</div>
    </div>

    <div class="message-row right">
      <div class="bubble light-gray-bubble">
        Coding สนุกจังเลย
        <span class="close-btn"><i class="fa-solid fa-xmark"></i></span>
      </div>
    </div>

    <div class="message-row right">
      <div class="bubble green-bubble">😍 😘</div>
    </div>

    <div class="message-row left">
      <div class="bubble dark-gray-bubble">😍</div>
    </div>

    <div class="message-row left">
      <div class="bubble dark-gray-bubble">😘</div>
    </div>
  </div>
</body>

</html>
